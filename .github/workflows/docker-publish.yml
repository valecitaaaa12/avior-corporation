# ============================================================
# AVIOR Corporation SRL
# GitHub Actions — Build de la imagen Docker y publicación
# automática en Docker Hub cada vez que se hace push a `main`.
# ============================================================

name: Docker Build & Push a Docker Hub

# Se ejecuta en cada push a la rama main (y manualmente desde la UI)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: avior-web

jobs:
  build-and-push:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Buildx (build multi-plataforma / caché)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login en Docker Hub usando los Secrets del repositorio
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Metadatos: etiquetas latest, sha y fecha
      - name: Generar etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/avior-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value={{date 'YYYYMMDD'}}

      # 5. Build y push a Docker Hub
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Resumen del build en el log
      - name: Resumen
        run: |
          echo "✅ Imagen publicada exitosamente en Docker Hub"
          echo "Imagenes: ${{ steps.meta.outputs.tags }}"
