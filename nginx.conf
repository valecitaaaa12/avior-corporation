server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para reducir el tamaño de las respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Archivos estáticos con caché larga (el build de Vite usa hashes en los nombres)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Endpoint de salud para Docker/Cloud
    location /healthz {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Enrutamiento SPA de React Router (BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
